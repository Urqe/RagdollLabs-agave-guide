<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A small guide to the body and taste of Mexican agave spirits — tequila, mezcal, bacanora and raicilla style profiles with example bottles.">
  <title>RagdollLabs Agave Guide</title>
  <base href="./">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <script>
    (function () {
      var stored = null;
      try { stored = localStorage.getItem("agave-theme"); } catch (e) {}
      var theme = stored || "dark";
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="./assets/ragdoll-cat.svg">
  <link rel="stylesheet" href="./assets/css/styles.css?v=agave-room-3">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="app-header">
    <a class="brand" href="#/"><img src="./assets/ragdoll-cat.svg" width="36" height="40" alt=""><span><span class="brand-wordmark">RagDoll<span>Labs</span></span><span class="brand-product">Agave Guide</span></span></a>
    <nav aria-label="Main">
      <a class="nav-link" data-view="explore" href="#/explore">Explore</a>
      <a class="nav-link" data-view="compare" href="#/compare" id="nav-compare">Compare</a>
      <a class="nav-link" data-view="catalogue" href="#/catalogue">Catalogue</a>
      <a class="nav-link" data-view="learn" href="#/learn">Learn</a>
    </nav>
    <div class="header-preferences" aria-label="Preferences">
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch color theme" title="Switch theme"> ☾ </button>
      <button type="button" class="theme-toggle" id="locale-toggle" aria-label="Switch language" title="Switch language">EN</button>
    </div>
  </header>
  <div id="app">
    <noscript>
      <p class="error-state">This app needs JavaScript to load its local data files. Esta aplicación necesita JavaScript para cargar sus datos locales.</p>
    </noscript>
  </div>
  <footer class="app-footer">
    <p>Editorial style guidance only. Drink responsibly.</p>
  </footer>
  <script type="module" src="./assets/js/app.js"></script>
</body>
</html>
